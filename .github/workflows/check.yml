name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the pinned test image
        run: docker build --platform linux/amd64 -f containers/test.Dockerfile -t fiat-checkpoints-test:ci .
      - name: Check the scaffold in the test image
        run: >-
          docker run --rm --platform linux/amd64 --network none
          --user "$(id -u):$(id -g)" --env HOME=/tmp
          --volume "$PWD:$PWD" --workdir "$PWD" fiat-checkpoints-test:ci
          python3 scripts/check.py --group scaffold
