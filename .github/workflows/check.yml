name: Scaffold checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.13'
      - name: Install the pinned check tool
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --require-hashes --only-binary=:all: -r requirements-tools.lock
      - name: Check the scaffold
        run: ./scripts/check.sh --group scaffold --report .reports/scaffold.json
